<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>EchoMind Voice Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />

</head>
<body>
    <header>
        <h1>EchoMind</h1>
        <p1>
            <br>EchoMind is your intelligent voice assistant that helps you manage tasks,
            set reminders,<br> and organize notes. Simply speak your commands, and let AI handle the rest.
        </p1>
    </header>

    <nav>
        <button id="dashboardNav">Dashboard</button>
        <button id="tasksNav">Tasks</button>
        <button id="notesNav">Notes</button>
        <button id="remindersNav">Reminders</button>
    </nav>

    <main>
        <button id="voiceAssistantBtn" class="voice-btn">🎙️ Activate EchoMind</button>

        <section id="dashboardSection">
            <h2>Dashboard</h2>
            <div>
                <h3>Recent Tasks</h3>
                <div id="dashboardTasks"></div>
                <button id="loadMoreTasksBtn">Load More Tasks</button>
            </div>
            <div>
                <h3>Recent Notes</h3>
                <div id="dashboardNotes"></div>
                <button id="loadMoreNotesBtn">Load More Notes</button>
            </div>
            <div>
                <h3>Recent Reminders</h3>
                <div id="dashboardReminders"></div>
                <button id="loadMoreRemindersBtn">Load More Reminders</button>
            </div>
        </section>

        <section id="tasksSection" style="display:none;">
            <h2>Tasks</h2>
            <div id="taskList"></div>
            <input type="text" id="taskInput" placeholder="Add a new task" />
            <button id="addTaskBtn">Add Task</button>
        </section>

        <section id="notesSection" style="display:none;">
            <h2>Notes</h2>
            <div id="noteList"></div>
            <input type="text" id="noteInput" placeholder="Add a new note" />
            <button id="addNoteBtn">Add Note</button>
        </section>

        <section id="remindersSection" style="display:none;">
            <h2>Reminders</h2>
            <div id="reminderList"></div>
            <input type="text" id="reminderInput" placeholder="Add a new reminder" />
            <button id="addReminderBtn">Add Reminder</button>
        </section>
    </main>

    <script src="app.js"></script>
</body>

</html>
